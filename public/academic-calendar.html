    <style>
        /* Long descriptions keep their line breaks */

            white-space: pre-line;
            min-width: 220px;
        }

        /* Post modal */
        #postModal .post-author-photo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        #postModal .post-author-initial {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9ecef;
            color: #555;
            font-weight: 600;
        }

        /* Plain-text posts keep their line breaks */
        #postModal .post-text {
            white-space: pre-line;
            color: #555;
            line-height: 1.6;
        }

        /* Posts written with formatting (paragraphs, bold...) */
        #postModal .post-html {
            color: #555;
            line-height: 1.6;
        }

        #postModal .post-html p {
            margin: 0 0 .75rem;
        }

        #postModal .post-html p:last-child {
            margin-bottom: 0;
        }

        #postModal .post-html ul,
        #postModal .post-html ol {
            padding-left: 1.25rem;
            margin: 0 0 .75rem;
        }

        #postModal .post-image {
            max-height: 500px;
            object-fit: contain;
        }

<body>

    <div id="header"></div>
    <!-- End Header -->

    <main id="main">

        <!-- ======= Breadcrumbs ======= -->
        <div class="breadcrumbs">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 id="page-title"></h2>
                    <ol id="breadcrumb-list"></ol>
                </div>
            </div>
        </div>
        <!-- End Breadcrumbs -->

        <section class="sample-page">
            <div class="container">

                <!-- Filters -->
                <div class="d-flex justify-content-end align-items-center mb-4 gap-3 flex-wrap">
                    <div class="d-flex align-items-center">
                        <label for="academic-location" class="form-label me-3 mb-0">Select Location</label>
                        <select id="academic-location" class="form-select">
                            <option value="" disabled selected>-- Select Location --</option>
                            <!-- Options loaded via fetch -->
                        </select>
                    </div>
                    <div class="d-flex align-items-center">
                        <label for="academic-year" class="form-label me-3 mb-0">Academic Year</label>
                        <select id="academic-year" class="form-select"></select>
                    </div>
                </div>

                <!-- Events table -->
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="thead-dark">
                            <tr>
                                <th>Event ID</th>
                                <th>Event</th>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Post</th>
                            </tr>
                        </thead>

                <div id="calendar-spinner" class="text-center my-4" style="display: none;">
                    <div class="spinner-border text-secondary" role="status">

    <!-- End #main -->

    <!-- Post modal -->
    <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">

                        <h5 class="modal-title" id="postModalLabel"></h5>

                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="postModalBody"></div>
            </div>
        </div>
    </div>

    <!-- ======= Footer ======= -->
    <div id="footer"></div>
    <!-- End Footer -->

    <a href="#" class="scroll-top d-flex align-items-center justify-content-center"><i

        crossorigin="anonymous"></script>

    <!-- Template Main JS File -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/main.js?v=7.2.0"></script>

    <script src="https://cdn.jsdelivr.net/gh/manucaralmo/GlowCookies@3.0.1/src/glowCookies.min.js"></script>
    <!-- Glow Cookies v3.0.1 -->
    <script>
        glowCookies.start('en', {

        });
    </script>

    <script>
        (function () {
            const API = window.location.hostname === 'localhost'
                ? 'http://localhost:8082/get_academic_calendar.php'
                : 'https://login.rssi.in/get_academic_calendar.php';

            // First month of the academic year (4 = April). Must match ACADEMIC_START_MONTH in the PHP file.
            const START_MONTH = 4;

            const locSelect = document.getElementById('academic-location');
            const select = document.getElementById('academic-year');
            const tbody = document.getElementById('calendar-table-body');
            const spinner = document.getElementById('calendar-spinner');
            const postModal = new bootstrap.Modal(document.getElementById('postModal'));
            let events = [];
            let requestId = 0; // ignore out-of-date responses if the user changes filters quickly

            /* ---------- Helpers ---------- */
            function esc(s) {
                const d = document.createElement('div');
                d.textContent = s == null ? '' : String(s);
                return d.innerHTML;
            }
            function attr(s) { return esc(s).replace(/"/g, '&quot;'); }

            // Plain-text posts: escape first, then turn URLs into links
            function linkify(text) {
                return esc(text).replace(/(https?:\/\/[^\s<]+)/g,
                    '<a href="$1" target="_blank" rel="noopener">$1</a>');
            }

            /* Posts can contain HTML (<p>, <strong>...). Only a short list of harmless tags is kept; scripts,
               styles, images, event attributes and unknown tags are removed, so nothing unsafe is ever rendered. */
            const ALLOWED_TAGS = ['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'UL', 'OL', 'LI', 'A', 'SPAN',
                'BLOCKQUOTE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6'];
            const DROP_TAGS = ['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'NOSCRIPT', 'TEMPLATE', 'SVG', 'MATH',
                'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'LINK', 'META', 'IMG', 'VIDEO', 'AUDIO'];

            function sanitizeHtml(html) {
                const doc = new DOMParser().parseFromString(html, 'text/html'); // inert: nothing runs or loads
                const out = document.createElement('div');

                (function walk(src, dst) {
                    src.childNodes.forEach(function (n) {
                        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
                        if (n.nodeType !== 1) return;

                        const tag = n.nodeName;
                        if (DROP_TAGS.indexOf(tag) !== -1) return;

                        if (ALLOWED_TAGS.indexOf(tag) !== -1) {
                            const el = document.createElement(tag.toLowerCase());
                            if (tag === 'A') {
                                const href = (n.getAttribute('href') || '').trim();
                                if (/^(https?:|mailto:)/i.test(href)) {
                                    el.setAttribute('href', href);
                                    el.setAttribute('target', '_blank');
                                    el.setAttribute('rel', 'noopener noreferrer');
                                }
                            }
                            walk(n, el);
                            dst.appendChild(el);
                        } else {
                            walk(n, dst); // unknown tag: drop the tag, keep its text
                        }
                    });
                })(doc.body, out);

                return out.innerHTML;
            }

            function renderPostText(text) {
                const t = text || '';
                return /<\/?[a-z][\s\S]*?>/i.test(t)
                    ? '<div class="post-html">' + sanitizeHtml(t) + '</div>'
                    : '<div class="post-text">' + linkify(t) + '</div>';
            }

            function parseDate(ymd) {
                const [y, m, d] = String(ymd).split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            function fmtDate(ymd) {
                const d = parseDate(ymd);
                if (isNaN(d)) return '';
                return String(d.getDate()).padStart(2, '0') + '/' +
                    String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
            }
            function weekday(ymd) {
                const d = parseDate(ymd);
                return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { weekday: 'long' });
            }
            function fmtDateTime(ts) {
                const d = new Date(String(ts).replace(' ', 'T')); // Safari-safe
                return isNaN(d) ? '' : d.toLocaleString('en-GB', {
                    day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit'
                });
            }
            function yearLabel(y) {
                return START_MONTH === 1 ? String(y) : y + '-' + String(y + 1).slice(2);
            }

            function showMessage(text, muted) {
                spinner.style.display = 'none';
                tbody.innerHTML = '<tr><td colspan="5" class="text-center' + (muted ? ' text-muted' : '') + '">' +
                    esc(text) + '</td></tr>';
            }
            function showLocationPrompt() {
                showMessage('Please select a location to view events.', true);
            }

            /* ---------- Year dropdown ---------- */
            const now = new Date();
            const currentAY = now.getFullYear() - ((now.getMonth() + 1) < START_MONTH ? 1 : 0);
            [currentAY + 1, currentAY, currentAY - 1, currentAY - 2, currentAY - 3].forEach(function (y) {
                select.insertAdjacentHTML('beforeend', '<option value="' + y + '">' + yearLabel(y) + '</option>');
            });

            const params = new URLSearchParams(window.location.search);
            const urlYear = parseInt(params.get('year'), 10);
            select.value = String(urlYear && select.querySelector('option[value="' + urlYear + '"]') ? urlYear : currentAY);

            /* ---------- Events (loaded only after a location is chosen) ---------- */
            function updateUrl() {
                const p = new URLSearchParams();
                p.set('year', select.value);
                if (locSelect.value) p.set('location', locSelect.value);
                history.pushState(null, '', window.location.pathname + '?' + p.toString());
            }

            function loadEvents() {
                if (!locSelect.value) { showLocationPrompt(); return; }

                const id = ++requestId;
                spinner.style.display = '';
                tbody.innerHTML = '';

                fetch(API + '?year=' + encodeURIComponent(select.value) + '&location=' + encodeURIComponent(locSelect.value))
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (id !== requestId) return;
                        if (!data || !data.success) throw new Error('bad response');
                        events = data.events || [];
                        render();
                    })
                    .catch(function () {
                        if (id !== requestId) return;
                        showMessage('Error loading data. Please try again.', false);
                    })
                    .finally(function () {
                        if (id === requestId) spinner.style.display = 'none';
                    });
            }

            function render() {
                if (!events.length) {
                    showMessage('No events found for this selection.', true);
                    return;
                }
                tbody.innerHTML = events.map(function (ev) {
                    const n = (ev.posts || []).length;
                    const postCell = n
                        ? '<button type="button" class="btn btn-sm btn-outline-primary btn-view-post" data-id="' + ev.id + '">' +
                        '<i class="bi bi-image me-1"></i>View post' + (n > 1 ? 's (' + n + ')' : '') + '</button>'
                        : '<span class="text-muted">&mdash;</span>';
                    return '<tr>' +
                        '<td>' + ev.id + '</td>' +
                        '<td class="fw-semibold">' + esc(ev.name) + '</td>' +
                        '<td class="text-nowrap">' + esc(fmtDate(ev.date)) +
                        '<div class="small text-muted">' + esc(weekday(ev.date)) + '</div></td>' +
                        '<td class="cal-desc">' + esc(ev.description || '') + '</td>' +
                        '<td>' + postCell + '</td>' +
                        '</tr>';
                }).join('');
            }

            /* ---------- Filter events ---------- */
            select.addEventListener('change', function () {
                loadEvents();
                updateUrl();
            });
            locSelect.addEventListener('change', function () {
                loadEvents();
                updateUrl();
            });

            /* ---------- Locations (small list, loaded first) ---------- */
            function loadLocations() {
                return fetch(API + '?action=locations')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (!data || !data.success) throw new Error('bad response');
                        (data.locations || []).forEach(function (name) {
                            locSelect.insertAdjacentHTML('beforeend',
                                '<option value="' + attr(name) + '">' + esc(name) + '</option>');
                        });
                    });
            }

            showLocationPrompt();
            loadLocations()
                .then(function () {
                    const wanted = params.get('location') || '';
                    if (wanted && locSelect.querySelector('option[value="' + CSS.escape(wanted) + '"]')) {
                        locSelect.value = wanted;
                        loadEvents();
                    }
                })
                .catch(function () {
                    showMessage('Could not load locations. Please refresh the page.', false);
                });

            /* ---------- Post modal ---------- */
            tbody.addEventListener('click', function (e) {
                const btn = e.target.closest('.btn-view-post');
                if (!btn) return;
                const ev = events.find(function (x) { return x.id === Number(btn.dataset.id); });
                if (ev && ev.posts && ev.posts.length) openPost(ev);
            });

            function openPost(ev) {
                document.getElementById('postModalLabel').textContent = ev.name;
                document.getElementById('postModalDate').textContent =
                    fmtDate(ev.date) + (ev.location ? ' · ' + ev.location : '');

                document.getElementById('postModalBody').innerHTML = ev.posts.map(function (p, i) {
                    const author = p.author || 'RSSI Team';
                    const avatar = p.author_photo
                        ? '<img class="post-author-photo" src="' + attr(p.author_photo) + '" alt="' + attr(author) + '">'
                        : '<div class="post-author-initial">' + esc(author.charAt(0).toUpperCase()) + '</div>';

                    return (i > 0 ? '<hr class="my-4">' : '') +
                        '<div class="d-flex align-items-center gap-3 mb-3">' + avatar +
                        '<div><div class="fw-semibold">' + esc(author) + '</div>' +
                        '<div class="small text-muted">' + esc(fmtDateTime(p.created_at)) + '</div></div></div>' +
                        renderPostText(p.description) +
                        (p.image
                            ? '<div class="mt-3"><img src="' + attr(p.image) + '" class="img-fluid rounded post-image" alt="Event image" loading="lazy"></div>'
                            : '');
                }).join('');

                postModal.show();
            }
        })();
    </script>
